<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="light dark"/>
<link rel="icon" href="data:,"/>
<title>Ruang Belajar</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#fafafa; --surface:#ffffff; --ink:#17181c; --muted:#6b7280; --line:#e5e5e7;
  --c-faris:#0f4c5c; --c-saiba:#8a4b6e;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121316; --surface:#1b1c20; --ink:#f2f2f4; --muted:#9a9ea8; --line:#2c2e34;
  --c-faris:#4fa3b8; --c-saiba:#c98bab; }
}
html{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,p{margin:0}
.wrap{max-width:640px;margin:0 auto;padding:28px 16px 48px}

/* HEADER */
header h1{font-size:1.75rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
header p.lead{color:var(--muted);font-size:.98rem;margin-top:6px}

/* DOORS */
.doors{display:flex;flex-direction:column;gap:14px;margin-top:26px}
.door{display:flex;align-items:center;gap:15px;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;padding:22px 18px;min-height:92px;
  text-decoration:none;color:var(--ink)}
.door:active{opacity:.85}
.avatar{flex:0 0 auto;width:48px;height:48px;border-radius:50%;background:var(--dc,var(--muted));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;font-weight:800}
.door-text{flex:1;min-width:0}
.door-name{display:block;font-size:1.45rem;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.door-desc{display:block;color:var(--muted);font-size:.92rem;margin-top:2px}
.arrow{flex:0 0 auto;font-size:1.35rem;color:var(--muted)}

footer{color:var(--muted);font-size:.85rem;margin-top:36px;border-top:1px solid var(--line);padding-top:14px}
footer p{margin:0}
</style>
</head>
<body>
<div id="lape-gate" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#fafafa;padding:24px;box-sizing:border-box">
<form id="lape-gate-form" style="width:100%;max-width:320px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<h1 style="font-size:1.4rem;margin:0 0 8px;color:#17181c">Ruang Belajar</h1>
<p style="color:#6b7280;font-size:.95rem;margin:0 0 20px">Masukkan PIN untuk masuk.</p>
<input id="lape-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="••••••" style="width:100%;padding:12px 14px;font-size:1.2rem;text-align:center;letter-spacing:.35em;border:1px solid #e5e5e7;border-radius:10px;box-sizing:border-box" />
<button type="submit" style="width:100%;margin-top:12px;padding:12px;font-size:1rem;font-weight:700;border:0;border-radius:10px;background:#17181c;color:#fff;cursor:pointer">Masuk</button>
<p id="lape-gate-err" style="color:#b3261e;font-size:.9rem;min-height:1.2em;margin:10px 0 0"></p>
</form>
</div>
<div class="wrap">

<header>
  <h1>Ruang Belajar</h1>
  <p class="lead">Pilih ruang belajarnya — ketuk nama untuk masuk.</p>
</header>

<nav class="doors" aria-label="Pilih ruang belajar">
  <a class="door" href="faris/" style="--dc:var(--c-faris)">
    <span class="avatar" aria-hidden="true">F</span>
    <span class="door-text">
      <span class="door-name">Faris</span>
      <span class="door-desc">Pidsus &amp; bidang hukum lainnya</span>
    </span>
    <span class="arrow" aria-hidden="true">→</span>
  </a>

  <a class="door" href="saiba/" style="--dc:var(--c-saiba)">
    <span class="avatar" aria-hidden="true">S</span>
    <span class="door-text">
      <span class="door-name">Saiba</span>
      <span class="door-desc">Ruang belajar UTS</span>
    </span>
    <span class="arrow" aria-hidden="true">→</span>
  </a>
</nav>

<footer>
  <p>Terakhir diperbarui 23 November 2026.</p>
</footer>
</div>
<script>
(function(){
var HASH='4e533dd40116d43b0b2926d0b4f49958849c4f6c8ec3c1f685e8e8e872b344da';
var gate=document.getElementById('lape-gate');
function unlock(){try{sessionStorage.setItem('lape-unlocked','1');}catch(e){}if(gate)gate.remove();}
try{if(sessionStorage.getItem('lape-unlocked')==='1'){unlock();return;}}catch(e){}
if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches){
gate.style.background='#121316';
var h=gate.querySelector('h1');if(h)h.style.color='#f2f2f4';
var ps=gate.querySelectorAll('p');for(var i=0;i<ps.length;i++){if(ps[i].id!=='lape-gate-err')ps[i].style.color='#9a9ea8';}
var inp=document.getElementById('lape-pin');if(inp){inp.style.background='#1b1c20';inp.style.color='#f2f2f4';inp.style.borderColor='#2c2e34';}
var btn=gate.querySelector('button');if(btn){btn.style.background='#f2f2f4';btn.style.color='#17181c';}
}
var form=document.getElementById('lape-gate-form');
var input=document.getElementById('lape-pin');
var err=document.getElementById('lape-gate-err');
if(input)input.focus();
form.addEventListener('submit',function(ev){
ev.preventDefault();
var v=(input.value||'').trim();
if(!v)return;
function fail(){err.textContent='PIN salah, coba lagi.';input.value='';input.focus();}
if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(function(buf){
var hex=Array.prototype.map.call(new Uint8Array(buf),function(b){return('00'+b.toString(16)).slice(-2);}).join('');
if(hex===HASH){unlock();}else{fail();}
}).catch(fail);
}else{fail();}
});
})();
</script>
</body>
</html>
